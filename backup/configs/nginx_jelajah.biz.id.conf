server {
    server_name jelajah.biz.id www.jelajah.biz.id;

    client_max_body_size 25M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location /static/ {
        alias /home/ubuntu/jelajah/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/ubuntu/jelajah/media/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jelajah.biz.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jelajah.biz.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.jelajah.biz.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jelajah.biz.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name jelajah.biz.id www.jelajah.biz.id;
    return 404; # managed by Certbot




}